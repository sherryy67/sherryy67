<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Sher Ali, full-stack engineer">
<style>
 .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace}
 .bar{transform-box:fill-box;transform-origin:left center;animation:g .7s cubic-bezier(.2,.7,.2,1) both}
 .lbl{animation:f .5s ease-out both}
 @keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}}
 @keyframes f{from{opacity:0}to{opacity:1}}
 @media (prefers-reduced-motion:reduce){.bar,.lbl{animation:none}}
</style>
